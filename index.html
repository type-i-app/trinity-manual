<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>trinity 運営マニュアル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
/* trinity 運営マニュアル — スマホ1列。上に細い帯、管理画面は下にタブ。
   配色は画面案(デザインキャンバス)の続き: 明るい背景・紺の文字・ティールが主役。
   三筒(筒子の3)のロゴは、3つの色の円で「trinity」を表す。 */
:root {
  --bg: #F5F8FA;
  --surface: #FFFFFF;
  --surface-2: #EAF1F5;
  --line: #D5E0E8;
  --fg: #17324D;
  --muted: #566C80;
  --accent: #0A7F62;
  --accent-fg: #FFFFFF;
  --accent-soft: #DCF2EA;
  --blue: #1F5FA8;
  --blue-soft: #E0EBF8;
  --c3: #C8473D;
  --warn: #8A5200;
  --warn-soft: #FCEFD3;
  --danger: #B42318;
  --danger-soft: #FDE6E3;
  --shadow: 0 1px 2px rgba(23, 50, 77, .06), 0 8px 24px rgba(23, 50, 77, .10);
  --font: 'Noto Sans JP', 'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A24; --surface: #152431; --surface-2: #1C3040; --line: #2B4256;
    --fg: #E6EEF4; --muted: #9DB2C3;
    --accent: #3CCB9F; --accent-fg: #06251D; --accent-soft: #123A30;
    --blue: #8DBBF2; --blue-soft: #1B3350; --c3: #F0877D;
    --warn: #F0B25A; --warn-soft: #3A2C10;
    --danger: #FF9187; --danger-soft: #3F1B18;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A24; --surface: #152431; --surface-2: #1C3040; --line: #2B4256;
  --fg: #E6EEF4; --muted: #9DB2C3;
  --accent: #3CCB9F; --accent-fg: #06251D; --accent-soft: #123A30;
  --blue: #8DBBF2; --blue-soft: #1B3350; --c3: #F0877D;
  --warn: #F0B25A; --warn-soft: #3A2C10;
  --danger: #FF9187; --danger-soft: #3F1B18;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
ul { margin: 0; padding: 0; list-style: none; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.wrap { width: 100%; max-width: 560px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { padding-block: 20px 40px; display: flex; flex-direction: column; gap: 24px; }
.has-tabs .page { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---- 上の帯 ---- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.bar-title { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--fg); }
.icon-btn:hover { background: var(--surface-2); }
.bar-mark { display: grid; place-items: center; width: 24px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; }
.avatar:hover { border-color: var(--accent); }

/* ---- ロゴ ---- */
.tile { display: block; }
.tile .face { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.tile .c1, .tile .c2, .tile .c3 { fill: none; stroke-width: 3.2; }
.tile .c1 { stroke: var(--accent); } .tile .c2 { stroke: var(--blue); } .tile .c3 { stroke: var(--c3); }

/* ---- ログイン ---- */
.auth { padding-block: 40px 56px; display: flex; flex-direction: column; gap: 28px; min-height: 100dvh; justify-content: center; }
.auth-brand { display: flex; align-items: center; gap: 14px; }
.wordmark { font-size: 30px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
.sub { color: var(--muted); font-size: 14px; letter-spacing: .12em; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
input[type=text], input[type=password], input[type=search], input:not([type]), select, textarea {
  width: 100%; min-height: 48px; padding: 10px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; font-size: 16px;
}
textarea { min-height: 150px; line-height: 1.6; resize: vertical; font-family: var(--mono); font-size: 13px; white-space: pre; overflow-x: auto; tab-size: 8; }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent); }
.pw { display: flex; gap: 8px; align-items: stretch; }
.pw input { flex: 1; min-width: 0; }
.error { color: var(--danger); background: var(--danger-soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; }
.hint li { list-style: none; padding-left: 1.2em; position: relative; }
.hint li::before { content: "・"; position: absolute; left: 0; }

/* ---- ボタン ---- */
.btn { min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.danger-line { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; filter: none; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* ---- 見本の案内 ---- */
.demo-note { border: 1.5px dashed var(--blue); background: var(--blue-soft); color: var(--blue); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; }
.demo-note strong { display: block; margin-bottom: 4px; }
.demo-logins { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.demo-logins .btn { min-height: 38px; padding: 0 12px; font-size: 13px; background: var(--surface); }
.demo-banner { background: var(--blue-soft); color: var(--blue); font-size: 12px; text-align: center; padding: 4px 8px; }

/* ---- ホーム ---- */
.hello h2 { font-size: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.blue { background: var(--blue-soft); color: var(--blue); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.admin-entry { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 16px 18px; min-height: 68px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 16px; box-shadow: var(--shadow); }
.admin-entry strong { display: block; font-size: 17px; }
.admin-entry small { color: var(--muted); font-size: 13px; }
.badge { min-width: 24px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--c3); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
.section-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list > li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; min-height: 52px; }
.list > li + li { border-top: 1px solid var(--line); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }

/* ---- 管理画面 ---- */
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec > h2 { font-size: 19px; }
.lead { color: var(--muted); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
details.how { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
details.how summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; font-size: 14px; cursor: pointer; }
details.how[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 10px; }
details.how .cols { padding-bottom: 12px; display: grid; gap: 6px; font-size: 13px; }
details.how .cols b { font-family: var(--mono); font-weight: 500; color: var(--accent); }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.items { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.items > li { padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.items > li + li { border-top: 1px solid var(--line); }
.items .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.items .top strong { min-width: 0; overflow-wrap: anywhere; }
.items .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.items .msg { font-size: 13px; color: var(--muted); }
.items li.bad .msg { color: var(--danger); font-weight: 700; }
.pwbox { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.pwbox code { flex: 1; min-width: 0; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; font-family: var(--mono); font-size: 18px; letter-spacing: .08em; overflow-wrap: anywhere; user-select: all; }
.results { border: 1.5px solid var(--accent); border-radius: 16px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.results h3 { font-size: 17px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 500; }
.filter { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.pill { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; white-space: nowrap; }
.pill.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.summary b { color: var(--fg); font-size: 16px; font-variant-numeric: tabular-nums; }
.people { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.person { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.person + .person { border-top: 1px solid var(--line); }
.p-head { display: flex; align-items: center; gap: 12px; }
.av { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); color: var(--muted); font-weight: 700; display: grid; place-items: center; flex: none; }
.p-main { min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.p-main strong { overflow-wrap: anywhere; }
.p-main .id { font-size: 12px; color: var(--muted); }
.ms { display: flex; flex-direction: column; gap: 8px; padding-left: 50px; }
.ms-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ms-store { font-size: 13px; font-weight: 700; margin-right: 2px; }
.ms-toggle { margin-left: auto; min-height: 36px; padding: 0 12px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.ms-toggle[aria-expanded=true] { border-color: var(--accent); color: var(--accent); }
.ms-panel { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.ms-panel .info { font-size: 12px; color: var(--muted); }
.ms-panel .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.event { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.event + .event { border-top: 1px solid var(--line); }
.event.new { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
.event .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.event .when { font-size: 12px; color: var(--muted); }
.stores-list li { flex-direction: column; align-items: stretch; gap: 4px; }
.stores-list .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.stores-list strong { font-size: 16px; }

/* ---- 下のタブ ---- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs { display: flex; padding-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.tab { flex: 1; position: relative; min-height: 60px; background: none; border: 0; border-top: 3px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tab.on { color: var(--accent); border-top-color: var(--accent); }
.tab .dot { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--c3); color: #fff; font-size: 11px; font-style: normal; line-height: 18px; text-align: center; }

/* ---- モーダルと通知 ---- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8, 20, 32, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90dvh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
@media (min-width: 600px) { .scrim { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h2 { font-size: 18px; }
.sheet .body { color: var(--muted); font-size: 14px; }
.sheet .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet .btns .btn { flex: 1; min-width: 120px; }
.bigpw { text-align: center; font-family: var(--mono); font-size: 26px; letter-spacing: .1em; padding: 16px; background: var(--surface-2); border-radius: 14px; overflow-wrap: anywhere; user-select: all; }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(12px); max-width: min(92vw, 420px); z-index: 60; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); color: #fff; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

</style>
</head>

<script>/* データの出入りは、すべてこのファイルの api に集める。
   (Supabaseから離れる場合も、このファイルだけ作り直せば画面はそのまま使える) */
const DEMO = false;
const SUPABASE_URL = 'https://ifadaicllbyibfcjkzym.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Mm-IUx47C7eXhj3OdHIYbw_eXTnMc-3'; // 公開してよい鍵(権限はDB側のルールで守られている)
const EMAIL_DOMAIN = 'staff.trinity.invalid'; // 個人番号を、配信されないメール形式に変える。Edge Functionと同じ値
const FN_URL = SUPABASE_URL + '/functions/v1/manage-accounts';

const api = (() => {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });

  const MSG = {
    'no active trainee found': 'この人は新人ではありません',
    'you cannot graduate yourself': '自分自身を独り立ちにはできません',
    'only store admins or educators of this store can do this': 'この操作をする権限がありません',
    'you cannot mark yourself as left': '自分自身は退店にできません',
    'only HQ can mark a store admin as left': '店舗管理者を退店にできるのは本部だけです',
    'only HQ or the store admin of this store can do this': 'この操作をする権限がありません',
    'only the store admin of this store can do this': 'この店の店舗管理者だけが確認できます',
    'no active membership found': 'この店には、いま所属していません',
    'no left membership found': 'この人は退店中ではありません',
    'event not found or already acknowledged': 'すでに確認済みです',
    'Failed to fetch': '通信できませんでした。電波を確認してもう一度試してください',
  };
  const NET = '通信できませんでした。電波を確認してもう一度試してください';
  const fail = (error) => {
    const text = (error && error.message) || '';
    const e = new Error(MSG[text] || text || '失敗しました');
    if ((error && error.status === 401) || /JWT|not authenticated|refresh_token/i.test(text)) e.code = 'auth';
    return e;
  };
  const ok = ({ data, error }) => { if (error) throw fail(error); return data; };

  async function profiles(ids) {
    const uniq = [...new Set(ids.filter(Boolean))];
    if (!uniq.length) return new Map();
    const rows = ok(await sb.from('profiles').select('id,login_id,display_name').in('id', uniq));
    return new Map(rows.map((p) => [p.id, p]));
  }

  async function callFn(body) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { const e = new Error('ログインが必要です'); e.code = 'auth'; throw e; }
    let res;
    try {
      res = await fetch(FN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify(body),
      });
    } catch (_) { throw new Error(NET); }
    let json = {};
    try { json = await res.json(); } catch (_) { /* 本文なし */ }
    if (!res.ok) {
      const e = new Error(json.error || '失敗しました');
      if (res.status === 401) e.code = 'auth';
      throw e;
    }
    return json;
  }

  return {
    async init() {
      const { data: { session } } = await sb.auth.getSession();
      return session ? { userId: session.user.id } : null;
    },
    async signIn(loginId, password) {
      const { data, error } = await sb.auth.signInWithPassword({ email: `${loginId}@${EMAIL_DOMAIN}`, password });
      if (error) {
        const t = error.message || '';
        if (error.code === 'user_banned' || /banned/i.test(t)) throw new Error('このアカウントは使えなくなっています。管理者に連絡してください');
        if (error.status === 429) throw new Error('試した回数が多すぎます。しばらく待ってからもう一度試してください');
        if (error.status === 400 || /Invalid login/i.test(t)) throw new Error('個人番号かパスワードが違います');
        throw new Error(NET);
      }
      return { userId: data.user.id };
    },
    async signOut() { await sb.auth.signOut(); },

    async getMe() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { const e = new Error('ログインが必要です'); e.code = 'auth'; throw e; }
      const [p, m, h] = await Promise.all([
        sb.from('profiles').select('id,login_id,display_name,must_change_password').eq('id', user.id).maybeSingle(),
        sb.from('memberships').select('id,store_id,role,is_trainer,is_trainee,left_at').eq('user_id', user.id).is('left_at', null),
        sb.from('hq_admins').select('user_id').eq('user_id', user.id).maybeSingle(),
      ]);
      const profile = ok(p);
      if (!profile) throw new Error('アカウントの情報が見つかりません。管理者に連絡してください');
      return { profile, memberships: ok(m) || [], isHq: !!ok(h) };
    },
    async listStores() { return ok(await sb.from('stores').select('id,name,sort_order').order('sort_order')); },
    async listChapters() { return ok(await sb.from('chapters').select('id,title,audience,sort_order').order('sort_order')); },

    async listRoster(storeIds, withHq) {
      if (!storeIds.length) return [];
      const ms = ok(await sb.from('memberships')
        .select('id,user_id,store_id,role,is_trainer,is_trainee,left_at,left_by,created_at').in('store_id', storeIds));
      const [pm, hq] = await Promise.all([
        profiles(ms.flatMap((m) => [m.user_id, m.left_by])),
        withHq ? sb.from('hq_admins').select('user_id') : Promise.resolve({ data: [] }),
      ]);
      const hqSet = new Set((ok(hq) || []).map((r) => r.user_id));
      return ms.map((m) => {
        const p = pm.get(m.user_id) || {};
        const by = pm.get(m.left_by) || {};
        return { ...m, login_id: p.login_id || '', display_name: p.display_name || '', is_hq: hqSet.has(m.user_id), left_by_name: by.display_name || '' };
      });
    },
    async listEvents(storeIds) {
      if (!storeIds.length) return [];
      const ev = ok(await sb.from('membership_events')
        .select('id,store_id,user_id,event,actor_id,created_at,acknowledged_by,acknowledged_at')
        .in('store_id', storeIds).order('created_at', { ascending: false }).limit(100));
      const pm = await profiles(ev.flatMap((e) => [e.user_id, e.actor_id, e.acknowledged_by]));
      const nm = (id) => (pm.get(id) || {}).display_name || '';
      return ev.map((e) => ({ ...e, user_name: nm(e.user_id), actor_name: nm(e.actor_id), ack_name: nm(e.acknowledged_by) }));
    },
    async countUnacked(storeIds) {
      if (!storeIds.length) return 0;
      const { count, error } = await sb.from('membership_events').select('id', { count: 'exact', head: true })
        .is('acknowledged_at', null).in('store_id', storeIds);
      if (error) throw fail(error);
      return count || 0;
    },

    async graduate(storeId, userId) { ok(await sb.rpc('graduate_trainee', { p_store_id: storeId, p_user_id: userId })); },
    async leave(storeId, userId) { ok(await sb.rpc('leave_store', { p_store_id: storeId, p_user_id: userId })); },
    async rejoin(storeId, userId) { ok(await sb.rpc('rejoin_store', { p_store_id: storeId, p_user_id: userId })); },
    async ackEvent(id) { ok(await sb.rpc('ack_membership_event', { p_event_id: id })); },
    async setTrainer(membershipId, on) {
      const rows = ok(await sb.from('memberships').update({ is_trainer: on }).eq('id', membershipId).select('id'));
      if (!rows.length) throw new Error('この操作をする権限がありません');
    },
    async setRole(membershipId, role) {
      const rows = ok(await sb.from('memberships').update({ role }).eq('id', membershipId).select('id'));
      if (!rows.length) throw new Error('この操作ができるのは本部だけです');
    },
    async addStore(name, sortOrder) {
      return ok(await sb.from('stores').insert({ name, sort_order: sortOrder }).select('id,name,sort_order').single());
    },
    async updateDisplayName(userId, name) {
      const rows = ok(await sb.from('profiles').update({ display_name: name }).eq('id', userId).select('id'));
      if (!rows.length) throw new Error('保存できませんでした');
    },

    async issue(rows) { return callFn({ action: 'issue', rows }); },
    async resetPassword(loginId) { return callFn({ action: 'reset_password', login_id: loginId }); },
    async changePassword(newPassword) { await callFn({ action: 'change_password', new_password: newPassword }); },
  };
})();

'use strict';
/* ================= 道具 ================= */
class Raw { constructor(s) { this.s = s; } }
const raw = (s) => new Raw(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const str = (v) => (v === false || v == null ? '' : v instanceof Raw ? v.s : Array.isArray(v) ? v.map(str).join('') : esc(v));
const html = (s, ...v) => new Raw(s.reduce((o, p, i) => o + p + (i < v.length ? str(v[i]) : ''), ''));
const $ = (sel, root = document) => root.querySelector(sel);
const toHalf = (s) => String(s || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[\s　]/g, '');
const DT = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
const fmtDT = (iso) => (iso ? DT.format(new Date(iso)) : '');
const ID_RE = /^[1-9][0-9]{0,19}$/;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const ICONS = {
  back: '<path d="M15 5l-7 7 7 7"/>',
  issue: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M19 7.5v6M16 10.5h6"/>',
  roster: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.9c2 .7 3.2 2.3 3.5 5.1"/>',
  log: '<path d="M5 3.5h14v17H5z"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4"/>',
  store: '<path d="M3 9.5L4.6 4h14.8L21 9.5"/><path d="M4.5 9.5V20h15V9.5"/><path d="M3 9.5c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
};
const icon = (n) => raw(`<svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`);
const TILE = (w) => raw(`<svg class="tile" viewBox="0 0 36 48" width="${w}" height="${Math.round(w * 4 / 3)}" aria-hidden="true"><rect class="face" x="1" y="1" width="34" height="46" rx="6"/><circle class="c1" cx="11" cy="12.5" r="5.2"/><circle class="c2" cx="18" cy="24" r="5.2"/><circle class="c3" cx="25" cy="35.5" r="5.2"/></svg>`);
const chip = (label, kind = '') => html`<span class="chip ${kind}">${label}</span>`;

/* ================= 状態 ================= */
const initialState = () => ({
  view: 'boot', prev: 'home', me: null, memberships: [], isHq: false, stores: [], chapters: [], unacked: 0,
  loginId: '', loginError: '', pwForced: false,
  adminTab: 'issue', filterStore: 'all', openKey: null, roster: null, events: null,
  issue: { text: '', defStore: '', defStance: '', preview: null, results: null },
  newStoreName: '', nameEdit: '', modal: null, modalBusy: false,
});
const S = initialState();
const resetState = () => { for (const k of Object.keys(S)) delete S[k]; Object.assign(S, initialState()); };

/* ================= 権限(画面に出す・出さないの判断。本当の判断はDB側) ================= */
const strictAdminIds = () => S.memberships.filter((m) => m.role === 'store_admin' && !m.left_at).map((m) => m.store_id);
const isStoreAdminOf = (id) => strictAdminIds().includes(id);
const isAdmin = () => S.isHq || strictAdminIds().length > 0;
const scopeStores = () => (S.isHq ? S.stores : S.stores.filter((s) => isStoreAdminOf(s.id)));
const effFilter = () => { const sc = scopeStores(); return sc.length === 1 ? sc[0].id : S.filterStore; };
const storeName = (id) => (S.stores.find((s) => s.id === id) || {}).name || '(不明な店)';
const initial = (n) => [...String(n || '?')][0];

/* ================= 部品 ================= */
function header({ title, back, account = true }) {
  return html`<header class="bar"><div class="wrap bar-in">
    ${back ? html`<button class="icon-btn" data-action="${back}" aria-label="戻る">${icon('back')}</button>` : html`<span class="bar-mark">${TILE(18)}</span>`}
    <h1 class="bar-title">${title}</h1>
    ${account ? html`<button class="avatar" data-action="go-account" aria-label="アカウント">${initial(S.me && S.me.name)}</button>` : ''}
  </div></header>`;
}
const loadingBlock = () => html`<div class="loading" role="status">読み込み中…</div>`;

const ROLE_IN = { '': 'staff', 'スタッフ': 'staff', '一般': 'staff', '店舗管理者': 'store_admin', '店長': 'store_admin', '本部管理者': 'hq', '本部': 'hq' };
const STANCE_IN = { '新人': 'trainee', '独り立ち': 'solo', '独立': 'solo', '一般': 'solo', '教育担当': 'trainer', '教育担当者': 'trainer', '教育': 'trainer' };
const ROLE_LABEL = { staff: 'スタッフ', store_admin: '店舗管理者', hq: '本部管理者' };
const STANCE_LABEL = { trainee: '新人', solo: '独り立ち済み', trainer: '教育担当' };
const norm = (s) => s.toLowerCase().replace(/[\s　]/g, '');

function parseRoster(text) {
  const sc = scopeStores();
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const rows = [];
  const seen = new Set();
  lines.forEach((line, idx) => {
    const c = line.split(/\t|,|，/).map((x) => x.trim());
    if (idx === 0 && /個人番号|^ID$/i.test(c[0])) return;
    const errs = [];
    const id = toHalf(c[0]);
    if (!ID_RE.test(id)) errs.push('個人番号は、先頭が0でない数字だけです');
    const name = (c[1] || '').trim();
    if (!name) errs.push('表示名がありません'); else if ([...name].length > 50) errs.push('表示名は50文字までです');
    const role = ROLE_IN[(c[3] || '').trim()];
    if (!role) errs.push(`区分「${c[3]}」がわかりません(スタッフ・店舗管理者・本部管理者)`);
    else if (role !== 'staff' && !S.isHq) errs.push('店舗管理者・本部管理者を発行できるのは本部だけです');
    let storeIds = [];
    const tokens = (c[2] || '').split(/[\/／・]/).map((t) => t.trim()).filter(Boolean);
    if (tokens.length) {
      tokens.forEach((t) => {
        const k = norm(t);
        const hit = sc.filter((s) => norm(s.name) === k);
        const part = hit.length ? hit : sc.filter((s) => norm(s.name).includes(k));
        if (part.length === 1) storeIds.push(part[0].id);
        else errs.push(part.length ? `「${t}」に当てはまる店が複数あります` : `「${t}」の店が見つかりません`);
      });
    } else if (role === 'hq') storeIds = sc.map((s) => s.id);
    else if (S.issue.defStore) storeIds = [S.issue.defStore];
    else errs.push('所属店がありません');
    storeIds = [...new Set(storeIds)];
    let stance = '';
    if (role === 'staff') {
      const t = (c[4] || '').trim();
      stance = t ? STANCE_IN[t] : S.issue.defStance;
      if (!stance) errs.push(t ? `立場「${t}」がわかりません(新人・独り立ち・教育担当)` : '立場を選ぶか、5列目に書いてください');
    }
    storeIds.forEach((sid) => { const k = id + ':' + sid; if (seen.has(k)) errs.push('同じ個人番号と店の行が重なっています'); seen.add(k); });
    rows.push({ line, id, name, role: role || 'staff', storeIds, stance, errs: [...new Set(errs)] });
  });
  return { rows, bad: rows.filter((r) => r.errs.length).length };
}

function actionsFor(m) {
  if (m.user_id === S.me.id) return [];
  const manage = S.isHq || isStoreAdminOf(m.store_id);
  if (!manage) return [];
  if (m.left_at) return ['rejoin'];
  const a = [];
  if (m.is_trainee && isStoreAdminOf(m.store_id)) a.push('graduate');
  if (m.role === 'staff' && !m.is_trainee) a.push(m.is_trainer ? 'untrain' : 'train');
  if (S.isHq) a.push(m.role === 'staff' ? 'promote' : 'demote');
  if (S.isHq || m.role === 'staff') { a.push('reset'); a.push('leave'); }
  return a;
}
function memberChips(m) {
  if (m.left_at) return [chip('退店中', 'danger')];
  const c = [m.role === 'store_admin' ? chip('店舗管理者', 'accent') : m.is_trainee ? chip('新人', 'warn') : chip('スタッフ')];
  if (m.is_trainer) c.push(chip('教育担当', 'blue'));
  return c;
}

  const list = [...groups.values()].sort((a, b) => (a.every((x) => x.left_at) - b.every((x) => x.left_at)) || a[0].display_name.localeCompare(b[0].display_name, 'ja'));

  return html`<li><div class="ms-row">${showStore ? html`<span class="ms-store">${storeName(m.store_id)}</span>` : ''}${memberChips(m)}${m.user_id === S.me.id ? chip('あなた', 'accent') : ''}
    ${acts.length ? html`<button class="ms-toggle" data-action="toggle-open" data-id="${m.id}" aria-expanded="${String(open)}">操作<span style="display:inline-block;transform:rotate(${open ? 180 : 0}deg)">${icon('chev')}</span></button>` : ''}</div>
    ${open ? html`<div class="ms-panel"><div class="info">${m.left_at ? `退店: ${fmtDT(m.left_at)}${m.left_by_name ? ' · 操作 ' + m.left_by_name : ''}` : `登録: ${fmtDT(m.created_at)}`}</div>
      <div class="acts">${acts.map((k) => html`<button class="btn small ${RACT[k].danger ? 'danger-line' : ''}" data-action="r-act" data-kind="${k}" data-id="${m.id}">${RACT[k].label}</button>`)}</div></div>` : ''}</li>`;
}

/* ---------- 管理: 履歴 ---------- */
const EV_TEXT = { graduated: ['が独り立ちになりました', 'accent'], left: ['が退店になりました', 'danger'], rejoined: ['が復帰しました', 'blue'] };
const EV_TAG = { graduated: '独り立ち', left: '退店', rejoined: '復帰' };
function tabLog() {
  if (!S.events) return loadingBlock();
  const f = effFilter();
  const ev = S.events.filter((e) => f === 'all' || e.store_id === f);
  const pending = ev.filter((e) => !e.acknowledged_at && isStoreAdminOf(e.store_id));
  return html`<section class="sec"><h2>履歴</h2>${storeFilter()}
    <p class="lead">独り立ち・退店・復帰の記録です。消すことはできません。店舗管理者は、見たものを「確認済み」にできます。</p>
    ${pending.length > 1 ? html`<div><button class="btn small" data-action="ack-all">未確認の${pending.length}件をすべて確認済みにする</button></div>` : ''}
    ${ev.length ? html`<ul class="people">${ev.map((e) => html`<li class="event ${e.acknowledged_at ? '' : 'new'}">
      <div class="line">${chip(EV_TAG[e.event], EV_TEXT[e.event][1])}<span><strong>${e.user_name || '(名前なし)'}</strong>${EV_TEXT[e.event][0]}</span></div>
      <div class="when">${storeName(e.store_id)} · ${fmtDT(e.created_at)} · 操作 ${e.actor_name || '本部'}</div>
      <div class="line">${e.acknowledged_at ? html`<span class="when">確認済み ${fmtDT(e.acknowledged_at)}${e.ack_name ? ' · ' + e.ack_name : ''}</span>`
        : html`${chip('未確認', 'warn')}${isStoreAdminOf(e.store_id) ? html`<button class="btn small" data-action="ack" data-id="${e.id}">確認済みにする</button>` : ''}`}</div></li>`)}</ul>`
      : html`<div class="empty">まだ記録がありません</div>`}
  </section>`;
}

/* ---------- 管理: 店舗(本部のみ) ---------- */
function tabStores() {
  if (!S.isHq) return html`<div class="empty">本部だけが使えます</div>`;
  if (!S.roster) return loadingBlock();
  return html`<section class="sec"><h2>店舗</h2>
    <ul class="list stores-list">${S.stores.map((s) => {
      const act = S.roster.filter((m) => m.store_id === s.id && !m.left_at);
      const admins = act.filter((m) => m.role === 'store_admin').map((m) => m.display_name).filter(Boolean);
      return html`<li><div class="top"><strong>${s.name}</strong><span class="hint">現役 ${act.length}人</span></div>
        <div class="hint">店舗管理者: ${admins.length ? admins.join('、') : 'まだいません'}</div></li>`;
    })}</ul>
    <form class="stack" data-form="store" novalidate>
      <div class="field"><label for="store-name">新しい店を追加</label>
        <input id="store-name" name="name" maxlength="40" autocomplete="off" placeholder="店名" data-bind="newStoreName" value="${S.newStoreName}"></div>
      <button class="btn block" type="submit">店を追加する</button>
      <p class="hint">追加した店は、共通のマニュアルがそのまま見え、店舗別の項目は空で始まります。店の店舗管理者は、「発行」で区分を「店舗管理者」にして登録します。</p>
    </form></section>`;
}

/* ================= モーダル・通知 ================= */
function renderModal() {
  const m = S.modal; const root = $('#modal');
  if (!m) { root.innerHTML = ''; return; }
  const body = m.kind === 'secret'
    ? html`<h2>${m.title}</h2><div class="bigpw" aria-label="パスワード">${m.password}</div><p class="body">${m.note}</p>
      <div class="btns"><button class="btn" data-action="modal-copy">${icon('copy')}コピー</button><button class="btn primary" data-action="modal-close">閉じる</button></div>`
    : html`<h2>${m.title}</h2><p class="body">${m.body}</p>
      <div class="btns"><button class="btn" data-action="modal-close" ${S.modalBusy ? raw('disabled') : ''}>キャンセル</button>
        <button class="btn ${m.danger ? 'danger' : 'primary'}" data-action="modal-ok" ${S.modalBusy ? raw('disabled') : ''}>${S.modalBusy ? '処理中…' : m.okLabel}</button></div>`;
  root.innerHTML = html`<div class="scrim" data-action="modal-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${m.title}">${body}</div></div>`.s;
  const first = root.querySelector('.btns .btn:last-child'); if (first) first.focus();
}
const openModal = (cfg) => { S.modal = cfg; S.modalBusy = false; renderModal(); };
const closeModal = () => { S.modal = null; S.modalBusy = false; renderModal(); };
let toastTimer = 0;
function toast(msg, kind = '') {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + kind;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast'; }, 3600);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (_) { /* 次へ */ }
  try { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (_) { return false; }
}
function setBusy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.textContent; btn.textContent = label; btn.disabled = true; } else { btn.textContent = label || btn.dataset.label || btn.textContent; btn.disabled = false; }
}

/* ================= 流れ ================= */
function render() {
  const v = { boot: viewBoot, login: viewLogin, password: viewPassword, home: viewHome, account: viewAccount, admin: viewAdmin }[S.view];
  $('#app').innerHTML = v().s;
  document.body.classList.toggle('has-tabs', S.view === 'admin');
}
function go(view, { top = true } = {}) {
  if (view === 'account') S.prev = S.view === 'admin' ? 'admin' : 'home';
  S.view = view; render();
  if (top) window.scrollTo(0, 0);
  if (view === 'admin') loadTab();
}
function onError(e) {
  console.error(e);
  if (e && e.code === 'auth') { toLogin('ログインの有効期限が切れました。もう一度ログインしてください'); return; }
  toast((e && e.message) || '失敗しました', 'error');
}
function toLogin(msg = '') { resetState(); S.loginError = msg; S.view = 'login'; render(); closeModal(); }

async function afterLogin() {
  const me = await api.getMe();
  S.me = { ...me.profile, name: me.profile.display_name || `個人番号 ${me.profile.login_id}` };
  S.nameEdit = me.profile.display_name || '';
  S.memberships = me.memberships; S.isHq = me.isHq;
  S.stores = await api.listStores();
  S.issue.defStore = scopeStores()[0] ? scopeStores()[0].id : '';
  if (S.me.must_change_password) { S.pwForced = true; go('password'); return; }
  await enterHome();
}
async function enterHome() {
  S.chapters = await api.listChapters().catch(() => []);
  S.unacked = strictAdminIds().length ? await api.countUnacked(strictAdminIds()).catch(() => 0) : 0;
  go('home');
}
async function loadTab(force = false) {
  const t = S.adminTab; const ids = scopeStores().map((s) => s.id);
  try {
    if ((t === 'roster' || t === 'stores') && (force || !S.roster)) S.roster = await api.listRoster(ids, S.isHq);
    if (t === 'log' && (force || !S.events)) S.events = await api.listEvents(ids);
    S.unacked = strictAdminIds().length ? await api.countUnacked(strictAdminIds()).catch(() => S.unacked) : 0;
  } catch (e) { onError(e); }
  if (S.view === 'admin' && S.adminTab === t) render();
}
const refreshAdmin = async () => { S.roster = null; S.events = null; await loadTab(true); };

/* ---------- ボタン ---------- */
const ACT = {};
ACT['toggle-pw'] = (el) => { const i = $('#' + el.dataset.target); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.textContent = show ? '隠す' : '表示'; };
ACT['demo-login'] = async (el) => { const f = $('form[data-form=login]'); f.elements.id.value = el.dataset.id; f.elements.pw.value = 'demo'; f.requestSubmit(); };
ACT.logout = async () => { try { await api.signOut(); } catch (_) { /* 切れていても続ける */ } toLogin(); };
ACT['go-home'] = () => go('home');
ACT['go-admin'] = () => go('admin');
ACT['go-account'] = () => go('account');
ACT['go-pw'] = () => { S.pwForced = false; go('password'); };
ACT.tab = (el) => { S.adminTab = el.dataset.tab; S.openKey = null; render(); window.scrollTo(0, 0); loadTab(); };
ACT.filter = (el) => { S.filterStore = el.dataset.store; S.openKey = null; render(); };
ACT['toggle-open'] = (el) => { S.openKey = S.openKey === el.dataset.id ? null : el.dataset.id; render(); };

ACT['issue-sample'] = () => {
  S.issue.text = ['701\t見本 新人A\t本店\tスタッフ\t新人', '702\t見本 経験者B\tannex\tスタッフ\t独り立ち', '512\t見本 五郎\t本店/annex'].join('\n');
  S.issue.preview = null; render();
};
ACT['issue-check'] = () => { S.issue.preview = parseRoster(S.issue.text); render(); };
ACT['issue-run'] = async (el) => {
  const p = S.issue.preview; if (!p || p.bad || !p.rows.length || p.rows.length > 50) return;
  setBusy(el, true, '発行中…');
  try {
    const res = await api.issue(p.rows.map(toPayload));
    const items = res.results.map((r, n) => ({ ...r, id: p.rows[n].id, name: p.rows[n].name, storeIds: p.rows[n].storeIds, line: p.rows[n].line }));
    S.issue.results = { items };
    const failed = items.filter((x) => x.status === 'error');
    S.issue.text = failed.map((x) => x.line).join('\n'); S.issue.preview = null;
    S.roster = null; S.events = null;
    render(); window.scrollTo(0, 0);
  } catch (e) { setBusy(el, false); throw e; }
};
ACT['copy-pw'] = async (el) => { const x = S.issue.results.items[+el.dataset.i]; toast(await copyText(x.password) ? 'コピーしました' : 'コピーできませんでした。手で選んでコピーしてください'); };
ACT['copy-all'] = async () => {
  const t = S.issue.results.items.filter((x) => x.status === 'created').map((x) => [x.id, x.name, x.password, storeLabels(x.storeIds)].join('\t')).join('\n');
  toast(await copyText(t) ? '表にしてコピーしました' : 'コピーできませんでした。手で選んでコピーしてください');
};
ACT['results-close'] = () => {
  const made = S.issue.results.items.some((x) => x.status === 'created');
  const close = () => { S.issue.results = null; closeModal(); render(); };
  if (!made) { close(); return; }
  openModal({ kind: 'confirm', title: 'パスワードを控えましたか', body: 'この画面を閉じると、発行したパスワードは二度と見られません。見られなくなっても、「名簿」から再発行はできます。', okLabel: '閉じる', onOk: close });
};

ACT['r-act'] = (el) => {
  const m = S.roster.find((x) => x.id === el.dataset.id); const k = el.dataset.kind; const a = RACT[k];
  const name = m.display_name || `個人番号 ${m.login_id}`;
  openModal({ kind: 'confirm', title: `${name}さん: ${a.label}`, body: a.ask(name, storeName(m.store_id)), okLabel: a.label, danger: !!a.danger,
    onOk: async () => {
      const r = await a.run(m);
      if (k === 'reset') {
        S.modal = { kind: 'secret', title: `${name}さんの新しいパスワード`, password: r.password, note: 'この画面を閉じると、二度と見られません。本人に直接伝えてください。次のログインで、パスワードの変更が必要になります。' };
        renderModal();
      } else { closeModal(); toast(a.ok); }
      S.openKey = null; await refreshAdmin();
    } });
};
ACT['modal-ok'] = async () => {
  const m = S.modal; if (!m || !m.onOk || S.modalBusy) return;
  S.modalBusy = true; renderModal();
  try { await m.onOk(); } catch (e) { S.modalBusy = false; renderModal(); onError(e); }
};
ACT['modal-close'] = () => closeModal();
ACT['modal-scrim'] = (el, e) => { if (e.target === el && S.modal && S.modal.kind !== 'secret') closeModal(); };
ACT['modal-copy'] = async () => { toast(await copyText(S.modal.password) ? 'コピーしました' : 'コピーできませんでした。手で選んでコピーしてください'); };

ACT.ack = async (el) => { await api.ackEvent(+el.dataset.id); toast('確認済みにしました'); S.events = null; await loadTab(true); };
ACT['ack-all'] = async (el) => {
  setBusy(el, true, '処理中…');
  const f = effFilter();
  const ids = S.events.filter((e) => !e.acknowledged_at && isStoreAdminOf(e.store_id) && (f === 'all' || e.store_id === f)).map((e) => e.id);
  try { for (const id of ids) await api.ackEvent(id); toast(`${ids.length}件を確認済みにしました`); } finally { S.events = null; await loadTab(true); }
};

/* ---------- フォーム ---------- */
const FORM = {};
FORM.login = async (f) => {
  const id = toHalf(f.elements.id.value); const pw = f.elements.pw.value; S.loginId = id;
  const show = (m) => { const e = $('#login-error'); e.textContent = m; e.hidden = !m; };
  if (!ID_RE.test(id)) return show('個人番号は、先頭が0でない数字だけで入力してください');
  if (!pw) return show('パスワードを入力してください');
  show('');
  const btn = f.querySelector('button[type=submit]'); setBusy(btn, true, 'ログイン中…');
  try { await api.signIn(id, pw); await afterLogin(); }
  catch (e) { if (e.code === 'auth') { show('ログインできませんでした。もう一度試してください'); } else show(e.message); f.elements.pw.value = ''; }
  finally { if (btn.isConnected) setBusy(btn, false, 'ログイン'); }
};
FORM.password = async (f) => {
  const a = f.elements.a.value; const b = f.elements.b.value; const err = $('#pw-error');
  const show = (m) => { err.textContent = m; err.hidden = !m; };
  if (a.length < 8) return show('8文字以上にしてください');
  if (a.length > 72) return show('72文字までにしてください');
  if (a === S.me.login_id) return show('個人番号と同じものは使えません');
  if (a !== b) return show('2回の入力が合っていません');
  show('');
  const btn = f.querySelector('button[type=submit]'); setBusy(btn, true, '変更中…');
  try {
    await api.changePassword(a); S.me.must_change_password = false;
    const was = S.pwForced; S.pwForced = false; toast('パスワードを変更しました');
    if (was) await enterHome(); else go('account');
  } catch (e) { if (e.code === 'auth') throw e; show(e.message); } finally { if (btn.isConnected) setBusy(btn, false); }
};
FORM.name = async (f) => {
  const name = f.elements.name.value.trim();
  if (!name) return toast('表示名を入力してください', 'error');
  await api.updateDisplayName(S.me.id, name);
  S.me.display_name = name; S.me.name = name; S.nameEdit = name; toast('保存しました'); render();
};
FORM.store = async (f) => {
  const name = f.elements.name.value.trim();
  if (!name) return toast('店名を入力してください', 'error');
  if (S.stores.some((s) => norm(s.name) === norm(name))) return toast('同じ名前の店がすでにあります', 'error');
  const s = await api.addStore(name, Math.max(-1, ...S.stores.map((x) => x.sort_order)) + 1);
  S.stores = [...S.stores, s]; S.newStoreName = ''; toast(`${name} を追加しました`); await refreshAdmin();
};

/* ---------- 入口 ---------- */
const BIND = {
  'issue.text': (v) => { S.issue.text = v; }, 'issue.defStore': (v) => { S.issue.defStore = v; }, 'issue.defStance': (v) => { S.issue.defStance = v; },
  newStoreName: (v) => { S.newStoreName = v; }, nameEdit: (v) => { S.nameEdit = v; },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.action]; if (!fn) return;
  e.preventDefault();
  Promise.resolve().then(() => fn(el, e)).catch(onError);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = FORM[f.dataset.form]; if (fn) Promise.resolve().then(() => fn(f)).catch(onError);
});
document.addEventListener('input', (e) => { const b = e.target.dataset && e.target.dataset.bind; if (b && BIND[b]) BIND[b](e.target.value); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal && S.modal.kind !== 'secret') closeModal(); });
window.addEventListener('beforeunload', (e) => {
  if (S.issue.results && S.issue.results.items.some((x) => x.status === 'created')) { e.preventDefault(); e.returnValue = ''; }
});

(async function boot() {
  render();
  try { const s = await api.init(); if (s) { await afterLogin(); return; } } catch (e) { console.error(e); }
  S.view = 'login'; render();
})();
</script>
</body>
</html>
